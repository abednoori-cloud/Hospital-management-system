# =========================================================
# H2 in-memory database profile (default / active out of the box)
# =========================================================

spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Open Session In View is intentionally enabled: several Thymeleaf views
# (patient/doctor detail pages, list pages showing appointment.patient.fullName
# etc.) render lazy-loaded JPA associations. Keeping the persistence context
# open through view rendering avoids LazyInitializationException without
# having to hand-write fetch-join queries for every list/detail screen.
spring.jpa.open-in-view=true

# H2 web console, useful during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
