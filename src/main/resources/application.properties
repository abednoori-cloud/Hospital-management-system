# =========================================================
# Hospital Management System - Default Configuration
# =========================================================
# By default the app runs on an in-memory H2 database so it
# starts and works immediately with zero setup (great for
# demos, grading, and first-run testing).
#
# To use MySQL instead, run with the "mysql" Spring profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# and edit application-mysql.properties with your credentials.
# =========================================================

spring.application.name=hospital-management-system
server.port=8080

# ---------- Active profile ----------
spring.profiles.active=h2

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.hospital.hms=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level %logger{36} - %msg%n

# ---------- Multipart / uploads (headroom for future use) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- Error handling ----------
server.error.whitelabel.enabled=false
server.error.include-message=always
