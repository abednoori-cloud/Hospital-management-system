<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <i class="fa-solid fa-staff-snake"></i>
            <h1>MediCore <small>HMS</small></h1>
            <p>Create a staff account</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/register}" th:object="${registerDto}" method="post" class="auth-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Jane Doe"/>
                <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="jdoe"/>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="jane.doe@hms.local"/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Minimum 6 characters"/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" th:field="*{role}" class="form-select">
                    <option value="">Select a role</option>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>

        <p class="auth-footer">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</div>
</body>
</html>
