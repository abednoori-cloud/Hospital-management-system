<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <i class="fa-solid fa-staff-snake"></i>
            <h1>MediCore <small>HMS</small></h1>
            <p>Hospital Management System</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </p>

        <div class="demo-creds">
            <strong>Demo credentials</strong>
            <div>Admin: <code>admin</code> / <code>Admin@123</code></div>
            <div>Doctor: <code>doctor</code> / <code>Doctor@123</code></div>
            <div>Receptionist: <code>reception</code> / <code>Reception@123</code></div>
        </div>
    </div>
</div>
</body>
</html>
