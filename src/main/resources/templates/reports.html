<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reports')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="page-body">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h1>Reports &amp; Analytics</h1>
                    <p class="text-muted">Hospital-wide performance at a glance.</p>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-card stat-blue">
                    <div class="stat-icon"><i class="fa-solid fa-bed-pulse"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" th:text="${totalPatients}">0</span>
                        <span class="stat-label">Total Patients</span>
                    </div>
                </div>
                <div class="stat-card stat-green">
                    <div class="stat-icon"><i class="fa-solid fa-user-doctor"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" th:text="${totalDoctors}">0</span>
                        <span class="stat-label">Total Doctors</span>
                    </div>
                </div>
                <div class="stat-card stat-purple">
                    <div class="stat-icon"><i class="fa-solid fa-calendar-check"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" th:text="${totalAppointments}">0</span>
                        <span class="stat-label">Total Appointments</span>
                    </div>
                </div>
                <div class="stat-card stat-amber">
                    <div class="stat-icon"><i class="fa-solid fa-sack-dollar"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" th:text="'$' + ${totalRevenue}">$0</span>
                        <span class="stat-label">Total Revenue (Paid)</span>
                    </div>
                </div>
            </div>

            <div class="card-panel">
                <div class="card-panel-header"><h2><i class="fa-solid fa-chart-column"></i> Appointments by Status</h2></div>
                <div class="chart-bars">
                    <div class="chart-bar-row" th:each="entry : ${statusCounts}">
                        <span class="chart-bar-label" th:text="${entry.key}">STATUS</span>
                        <div class="chart-bar-track">
                            <div class="chart-bar-fill" th:classappend="'badge-' + ${entry.key}"
                                 th:style="'width: ' + (${entry.value} * 100 / ${maxStatusCount}) + '%'"></div>
                        </div>
                        <span class="chart-bar-value" th:text="${entry.value}">0</span>
                    </div>
                </div>
            </div>

            <div class="card-panel">
                <div class="card-panel-header"><h2><i class="fa-solid fa-file-invoice-dollar"></i> Invoices by Payment Status</h2></div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                        <tr><th>Payment Status</th><th>Count</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${invoicesByStatus}">
                            <td><span class="badge" th:classappend="'badge-pay-' + ${entry.key}" th:text="${entry.key}">Status</span></td>
                            <td th:text="${entry.value}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
