<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${doctorDto.id} != null ? 'Edit Doctor' : 'Add Doctor')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="page-body">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h1 th:text="${doctorDto.id} != null ? 'Edit Doctor' : 'Add Doctor'">Add Doctor</h1>
                    <p class="text-muted">Manage doctor profile and consultation details.</p>
                </div>
                <a th:href="@{/doctors}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to list</a>
            </div>

            <div class="card-panel form-panel">
                <form th:action="${doctorDto.id} != null ? @{/doctors/{id}(id=${doctorDto.id})} : @{/doctors}"
                      th:object="${doctorDto}" method="post">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="form-group">
                            <label for="phoneNumber">Phone Number *</label>
                            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>
                        <div class="form-group">
                            <label for="specialization">Specialization *</label>
                            <input type="text" id="specialization" th:field="*{specialization}" class="form-control" placeholder="e.g. Cardiology"/>
                            <div class="field-error" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></div>
                        </div>
                        <div class="form-group">
                            <label for="department">Department</label>
                            <input type="text" id="department" th:field="*{department}" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label for="yearsOfExperience">Years of Experience</label>
                            <input type="number" min="0" id="yearsOfExperience" th:field="*{yearsOfExperience}" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label for="consultationFee">Consultation Fee ($)</label>
                            <input type="number" step="0.01" min="0" id="consultationFee" th:field="*{consultationFee}" class="form-control"/>
                        </div>
                        <div class="form-group form-check-group">
                            <input type="checkbox" id="available" th:field="*{available}" class="form-check-input"/>
                            <label for="available">Currently available for appointments</label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Doctor</button>
                        <a th:href="@{/doctors}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
