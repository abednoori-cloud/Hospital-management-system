<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Doctors')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="page-body">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h1>Doctors</h1>
                    <p class="text-muted">Manage doctor profiles, specializations, and availability.</p>
                </div>
                <a th:href="@{/doctors/new}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')"><i class="fa-solid fa-plus"></i> Add Doctor</a>
            </div>

            <div class="card-panel">
                <form th:action="@{/doctors}" method="get" class="toolbar-search">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name, specialization, or department..." class="form-control"/>
                    <button type="submit" class="btn btn-outline"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                </form>

                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Department</th>
                            <th>Experience</th>
                            <th>Fee</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${doctorPage.content}">
                            <td th:text="${d.id}">1</td>
                            <td><a th:href="@{/doctors/{id}(id=${d.id})}" th:text="${d.fullName}">Name</a></td>
                            <td th:text="${d.specialization}">Specialization</td>
                            <td th:text="${d.department} ?: '—'">Department</td>
                            <td th:text="${d.yearsOfExperience} + ' yrs'">0 yrs</td>
                            <td th:text="'$' + ${d.consultationFee}">$0</td>
                            <td>
                                <span class="badge" th:classappend="${d.available} ? 'badge-SCHEDULED' : 'badge-CANCELLED'"
                                      th:text="${d.available} ? 'Available' : 'Unavailable'">Status</span>
                            </td>
                            <td class="text-end actions-cell">
                                <a th:href="@{/doctors/{id}(id=${d.id})}" class="btn-icon" title="View"><i class="fa-solid fa-eye"></i></a>
                                <a th:href="@{/doctors/{id}/edit(id=${d.id})}" class="btn-icon" title="Edit" sec:authorize="hasRole('ADMIN')"><i class="fa-solid fa-pen"></i></a>
                                <form th:action="@{/doctors/{id}/delete(id=${d.id})}" method="post" class="d-inline" sec:authorize="hasRole('ADMIN')"
                                      onsubmit="return confirm('Delete this doctor? This cannot be undone.');">
                                    <button type="submit" class="btn-icon btn-icon-danger" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(doctorPage.content)}">
                            <td colspan="8" class="text-center text-muted">No doctors found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/pagination :: pagination(${doctorPage}, '/doctors')}"></div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
