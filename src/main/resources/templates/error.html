<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body class="auth-body">
<div class="error-wrapper">
    <div class="error-card">
        <i class="fa-solid fa-triangle-exclamation error-icon"></i>
        <h1 th:text="${statusCode} ?: 'Error'">Error</h1>
        <h2>Something Went Wrong</h2>
        <p th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again later.'">Message</p>
        <a th:href="@{/dashboard}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Dashboard</a>
    </div>
</div>
</body>
</html>
