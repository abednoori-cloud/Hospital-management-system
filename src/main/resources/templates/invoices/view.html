<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Invoice Details')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="page-body">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h1 th:text="${invoice.invoiceNumber}">INV-000001</h1>
                    <p class="text-muted">Invoice details and receipt</p>
                </div>
                <div class="header-actions">
                    <a th:href="@{/invoices/{id}/edit(id=${invoice.id})}" class="btn btn-outline" sec:authorize="hasRole('RECEPTIONIST')"><i class="fa-solid fa-pen"></i> Edit</a>
                    <button onclick="window.print()" class="btn btn-outline"><i class="fa-solid fa-print"></i> Print Receipt</button>
                    <a th:href="@{/invoices}" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Back</a>
                </div>
            </div>

            <div class="card-panel receipt-panel">
                <div class="receipt-header">
                    <div>
                        <i class="fa-solid fa-staff-snake"></i>
                        <span>MediCore Hospital</span>
                    </div>
                    <div class="receipt-invoice-no">
                        <span th:text="${invoice.invoiceNumber}">INV-000001</span>
                        <span class="badge" th:classappend="'badge-pay-' + ${invoice.paymentStatus}" th:text="${invoice.paymentStatus}">Status</span>
                    </div>
                </div>

                <dl class="detail-list">
                    <dt>Patient</dt><dd th:text="${invoice.patient.fullName}">Patient</dd>
                    <dt>Doctor</dt><dd th:text="${invoice.doctor != null ? invoice.doctor.fullName : 'N/A'}">Doctor</dd>
                    <dt>Invoice Date</dt><dd th:text="${#temporals.format(invoice.invoiceDate, 'dd MMM yyyy')}">Date</dd>
                    <dt>Treatment</dt><dd th:text="${invoice.treatmentDescription}">Treatment</dd>
                </dl>

                <div class="receipt-total">
                    <span>Total Amount</span>
                    <strong th:text="'$' + ${invoice.treatmentCost}">$0.00</strong>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
