<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit User')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="page-body">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h1 th:text="'Edit User — ' + ${user.fullName}">Edit User</h1>
                    <p class="text-muted">Update this account's role, access, and doctor profile link.</p>
                </div>
                <a th:href="@{/users}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to list</a>
            </div>

            <div class="card-panel form-panel">
                <form th:action="@{/users/{id}(id=${user.id})}" th:object="${userEditDto}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" class="form-control" th:value="${user.username}" disabled/>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="text" class="form-control" th:value="${user.email}" disabled/>
                        </div>
                        <div class="form-group">
                            <label for="role">Role *</label>
                            <select id="role" th:field="*{role}" class="form-select">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>
                        <div class="form-group">
                            <label for="doctorId">Linked Doctor Profile <small class="text-muted">(DOCTOR role only)</small></label>
                            <select id="doctorId" th:field="*{doctorId}" class="form-select">
                                <option value="">Not linked</option>
                                <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName} + ' — ' + ${d.specialization}">Doctor</option>
                            </select>
                        </div>
                        <div class="form-group form-check-group">
                            <input type="checkbox" id="enabled" th:field="*{enabled}" class="form-check-input"/>
                            <label for="enabled">Account is enabled (can log in)</label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                        <a th:href="@{/users}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
