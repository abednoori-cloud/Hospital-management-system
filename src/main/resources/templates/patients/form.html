<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${patientDto.id} != null ? 'Edit Patient' : 'Add Patient')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="page-body">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h1 th:text="${patientDto.id} != null ? 'Edit Patient' : 'Add Patient'">Add Patient</h1>
                    <p class="text-muted">Fill in the patient's personal and contact information.</p>
                </div>
                <a th:href="@{/patients}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to list</a>
            </div>

            <div class="card-panel form-panel">
                <form th:action="${patientDto.id} != null ? @{/patients/{id}(id=${patientDto.id})} : @{/patients}"
                      th:object="${patientDto}" method="post">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="form-group">
                            <label for="phoneNumber">Phone Number *</label>
                            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>
                        <div class="form-group">
                            <label for="dateOfBirth">Date of Birth *</label>
                            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control"/>
                            <div class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender *</label>
                            <select id="gender" th:field="*{gender}" class="form-select">
                                <option value="">Select gender</option>
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}">GENDER</option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                        </div>
                        <div class="form-group">
                            <label for="bloodGroup">Blood Group</label>
                            <input type="text" id="bloodGroup" th:field="*{bloodGroup}" class="form-control" placeholder="e.g. O+"/>
                        </div>
                        <div class="form-group">
                            <label for="emergencyContact">Emergency Contact</label>
                            <input type="text" id="emergencyContact" th:field="*{emergencyContact}" class="form-control"/>
                        </div>
                        <div class="form-group form-group-full">
                            <label for="address">Address</label>
                            <textarea id="address" th:field="*{address}" class="form-control" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Patient</button>
                        <a th:href="@{/patients}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
