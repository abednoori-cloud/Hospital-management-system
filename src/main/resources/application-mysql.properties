# =========================================================
# MySQL profile - activate with -Dspring-boot.run.profiles=mysql
# Update the credentials below to match your local MySQL setup.
# Create the schema first:  CREATE DATABASE hospital_management_db;
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# See application-h2.properties for why this is intentionally true.
spring.jpa.open-in-view=true
